I('Extra Reis','+20 Max-LP und heilt 20',0,p=>{p.max+=20;heal(p,20)},'rice',6),
I('Ingwer','Heilt 35% der LP',0,p=>heal(p,p.max*.35),'ginger',99),
I('Riesen-Reiskorn','Größere Schüsse, +10% Schaden',0,p=>{p.big++;p.dmg*=1.1},'big',3),

I('Gräten-Spieße','Schüsse durchschlagen +1',1,p=>p.pierce++,'bones',4),

I('Tempura-Kruste','+50 Max-LP und volle Heilung',2,p=>{p.max+=50;p.hp=p.max},'tempura',3),

I('Lachs-Herz','Heilt 2 LP pro Sekunde',2,p=>p.reg+=2,'halo',3),

I('Wasabi-Bomben','Wirft explodierende Bomben auf Gegner',2,p=>p.bombs++,'bombs',3),

I('Goldene Stäbchen','+50% Schaden, +25% Feuerrate',3,p=>{p.dmg*=1.5;p.rate*=1.25},'gold',2),
I('Drachenrolle','Feuer-Aura +30, +1 Durchschlag',3,p=>{p.aura+=30;p.pierce++},'dragon',2),
I('Kaiserkrone','+1 Projektil, +20% Schaden und Tempo',3,p=>{p.multi++;p.dmg*=1.2;p.spd*=1.2},'crown',2,{pj:1}),
I('Fugu-Gift','Besiegte Gegner explodieren',3,p=>p.boom+=20+wave*1.2,'fugu',2),
I('Maneki-Neko','Goldene Glückskatze mit Dauerfeuer',3,p=>addPet(p,'gold'),'gold_cat',1),
I('Raijin-Blitz','Treffer lösen Kettenblitze aus',3,p=>p.chain+=.25,'chain',2),
I('Matcha-Zeitlupe','Gegner und ihre Schüsse 30% langsamer',3,p=>p.slow=Math.min(.5,p.slow+.3),'slow',1)];
function addPet(p,k){p.pets.push({k,x:p.x,y:p.y,cd:.5,i:p.pets.length,wk:0})}
function avail(pl,it){if((pl.cnt[it.n]||0)>=it.mx)return false;if(it.ex&&pl.ex[it.ex]&&pl.ex[it.ex]!==it.n)return false;if(it.pj&&pl.xproj+it.pj>MAXPJ)return false;return true}
function exOther(it){const o=items.find(o=>o.ex==it.ex&&o!==it);return o?o.n:''}
// Seltenheit: Legendär 1-4%, Episch 4-11%, Selten 16-26%
function rollRarity(){const r=Math.random()*100,L=Math.min(4,1+wave*.03),E=Math.min(11,4+wave*.07),R=Math.min(26,16+wave*.1);return r<L?3:r<L+E?2:r<L+E+R?1:0}
function rollPicks(pl){const out=[];for(let s=0;s<3;s++){const r0=rollRarity();for(const r of[r0,r0-1,r0-2,r0-3,r0+1,r0+2,r0+3]){if(r<0||r>3)continue;const pool=items.filter(i=>i.r==r&&!out.includes(i)&&avail(pl,i));if(pool.length){out.push(pool[Math.random()*pool.length|0]);break}}}return out}
function applyItem(pl,it){it.f(pl);pl.cnt[it.n]=(pl.cnt[it.n]||0)+1;if(it.ex)pl.ex[it.ex]=it.n;if(it.pj)pl.xproj+=it.pj;pl.got.push(it);pl.vis[it.v]=(pl.vis[it.v]||0)+1;
if(pl===P){if(it.r==3)unlockAch('leg');if(pl.xproj>=MAXPJ)unlockAch('proj');if(pl.pets.length>=2)unlockAch('pets')}}

['k1k','Fließband','Besiege 1.000 Gegner'],['k10k','Sushi-Sturm','Besiege 10.000 Gegner'],['leg','Glückspilz','Nimm ein legendäres Item'],['proj','Volle Ladung','Erreiche 5 Extra-Projektile'],
['pets','Tierfreund','Habe 2 Haustiere gleichzeitig'],['party','Party-Zeit','Spiele eine Mehrspieler-Runde'],['sorts','Sammler','Schalte alle 11 Sorten frei'],['games10','Stammgast','Spiele 10 Runden']];

function toast(s,c){toasts.push({s,c:c||'#ffcf5a',t:3.2});if(toasts.length>3)toasts.shift()}
function unlockAch(id){if(prof.ach.includes(id))return;prof.ach.push(id);const a=ACH.find(a=>a[0]==id);toast('Erfolg freigeschaltet: '+(a?a[1]:id));sfxL(880,.12,'triangle',.15,1320);saveProf()}
function checkAch(){const s=prof.stats;if(s.bosses>=1)unlockAch('boss1');if(prof.bt.length>=9)unlockAch('bosses9');if(save.best>=50)unlockAch('w50');if(save.best>=100){unlockAch('w100');unlockAch('sorts')}
if(s.kills>=1000)unlockAch('k1k');if(s.kills>=10000)unlockAch('k10k');if(s.games>=10)unlockAch('games10');if(s.mp>=1)unlockAch('party')}
function bossKilled(ty,fin){prof.stats.bosses++;if(!fin&&!prof.bt.includes(ty))prof.bt.push(ty);checkAch();saveProf()}

const TH=[

/* ---------- Audio ---------- */
let AC,step=0,nxt=0;
function snd(){try{if(!AC){AC=new AudioContext();nxt=AC.currentTime}if(AC.state=='suspended')AC.resume()}catch(e){}}
function note(f,tm,d,ty,v,f2){if(v<=0)return;const o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,tm);if(f2)o.frequency.exponentialRampToValueAtTime(f2,tm+d);a.gain.setValueAtTime(v,tm);a.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(a);a.connect(AC.destination);o.start(tm);o.stop(tm+d)}
function sfxL(f,d,ty,v,f2){if(AC&&set.sfx>0)note(f,AC.currentTime,d,ty,v*set.sfx,f2)}
function sfx(f,d,ty,v,f2){sfxL(f,d,ty,v,f2);if(NET.mode=='host'&&EV.length<300)EV.push(['s',f,d,ty,v,f2||0])}
function music(){if(!AC)return;const mv=set.music,sp=60/(128+(wave||0)*.6)/4,bs=[55,55,82,55,65,55,98,73];if(nxt<AC.currentTime-.5)nxt=AC.currentTime;
while(nxt<AC.currentTime+.15){const s=step%16;if(mv>0){if(s%4==0)note(160,nxt,.14,'sine',.6*mv,40);if(s%4==2)note(8000,nxt,.03,'square',.05*mv);if(s%2==1||s%4==0)note(bs[(step>>1)%8]*(wave>50?2:1),nxt,.1,'sawtooth',.1*mv);if(s==0||s==10)note(s?660:440,nxt,.08,'square',.04*mv)}nxt+=sp;step++}}

/* ---------- Server: Konto und Party (nur wenn das Spiel über den eigenen Server läuft) ---------- */
const NET={ok:false,ws:null,code:'',id:'',host:false,hostId:'',members:[],mode:''};
let auth={token:lsGet('sushi_tok',''),user:''};
async function checkServer(){try{const c=new AbortController();setTimeout(()=>c.abort(),4000);const r=await fetch('api/ping',{cache:'no-store',signal:c.signal});NET.ok=r.ok&&(await r.json()).ok===true}catch(e){NET.ok=false}if(NET.ok)loadMe()}
async function api(path,body){const h={'Content-Type':'application/json'};if(auth.token)h.Authorization='Bearer '+auth.token;const r=await fetch('api/'+path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Der Server hat nicht geantwortet');return j}
function profData(){return{avatar:prof.avatar,stats:prof.stats,bt:prof.bt,ach:prof.ach,best:save.best}}
function mergeIn(d){if(!d)return;const s=d.stats||{};for(const k in prof.stats)prof.stats[k]=Math.max(prof.stats[k]||0,s[k]||0);prof.bt=[...new Set([...prof.bt,...(d.bt||[])])];prof.ach=[...new Set([...prof.ach,...(d.ach||[])])];
if(typeof d.avatar=='number')prof.avatar=d.avatar;if(d.best>save.best){save.best=d.best;store()}lsSet('sushi_prof',prof)}
async function loadMe(){if(!auth.token)return;try{const j=await api('me');auth.user=j.user;prof.name=j.user;mergeIn(j.data);syncUp()}catch(e){auth.token='';auth.user='';lsSet('sushi_tok','')}}
async function doAuth(u,p,reg){const j=await api(reg?'register':'login',{user:u,pass:p});auth.token=j.token;auth.user=j.user;lsSet('sushi_tok',j.token);prof.name=j.user;mergeIn(j.data);saveProf();toast(reg?'Konto erstellt – willkommen, '+j.user+'!':'Angemeldet als '+j.user,'#8fe36b')}
async function logout(){try{await api('logout',{})}catch(e){}auth.token='';auth.user='';lsSet('sushi_tok','');toast('Abgemeldet','#a9a3cf')}
let syncTo=0;function syncUp(){if(!auth.token||!NET.ok)return;clearTimeout(syncTo);syncTo=setTimeout(()=>api('sync',{data:profData()}).then(j=>mergeIn(j.data)).catch(()=>{}),900)}

function onNet(m){switch(m.t){

camX=clamp(P.x-W/2,0,AW-W);camY=clamp(P.y-H/2,0,AH-H);nextWave();scene='play';
for(const pl of PL)if(V[pl.sel].legend){const L=items.filter(i=>i.r==3&&avail(pl,i)),it=L[Math.random()*L.length|0];applyItem(pl,it);if(pl===P){msg='Start-Item: '+it.n;msg2='';msgT=2.5}}

function nextWave(){wave++;en=[];eb=[];hz=[];pb=[];pend=[];boss=null;queue=[];spawnT=.6;mineL=[];bombL=[];post=0;const z=zone();
for(const pl of PL)if(pl.dead){const a=PL.find(p=>!p.dead);pl.dead=false;pl.hp=pl.max*.4;pl.inv=1.5;if(a){pl.x=a.x+30;pl.y=a.y}}
if(wave==100)boss=mkBoss(9);
else if(wave%10==0)boss=mkBoss(z);
else{const n=Math.floor((10+wave*1.6+z*6)*(1+(PL.length-1)*.45));for(let i=0;i<n;i++){const r=Math.random();queue.push(z>0&&r<.36?z+2:wave>4&&r<.55?2:wave>1&&r<.75?1:0)}}
msg=boss?'':'Welle '+wave;msg2='';msgT=boss?0:2.2;
if(!boss&&wave>1&&wave%10==1){msg='Neue Zone: '+TH[z].n;msg2='Neue Gegner: '+ZE[z];msgT=3.4}}
function mkBoss(ty){const z=zone(),fin=ty==9,f=PL.length>1?1+(PL.length-1)*.6:1,hp=Math.round((fin?52000:(700+wave*130)*(1+z*.3))*f),c=nearPl(AW/2,AH/2),tx=clamp(c.x,220,AW-220),hy=clamp(c.y-280,150,AH-300);
sfx(60,1.2,'sawtooth',.25,30);
return{ty,final:fin,x:tx,y:hy-520,hx:tx,hy,hp,max:hp,r:fin?70:BR[ty],at:1.4,n:0,fl:0,name:fin?'Die Hand mit Stäbchen':BN[ty],intro:2.6,dying:0,sum:22,al:1,rot:0,z:0}}
function mkEnemy(k,x,y,o){const z=zone(),b=(14+wave*5.5)*(1+z*.3),sp=Math.min(75+wave*.9,190);
const S=[[1,1,13],[.6,1.7,10],[1.8,.7,15],[1.1,1,13],[.9,1,12],[1,1.1,13],[1.4,.55,14],[1.2,.9,13],[2.4,.45,17],[1.2,.8,15],[1,.9,13],[2,.75,16]][k];
const e={id:++eid,x,y,k,hp:b*S[0],sp:sp*S[1],r:S[2],fl:0,cd:1+Math.random()*2,st:0,tm:1+Math.random(),z:0,al:1,em:0};if(o)Object.assign(e,o);e.mhp=e.hp;return e}
function pickTube(){const a=TUBES[Math.random()*TUBES.length|0],b=TUBES[Math.random()*TUBES.length|0],ma=mouth(a),mb=mouth(b),pa=nearPl(ma[0],ma[1]),pbb=nearPl(mb[0],mb[1]);return D(ma[0],ma[1],pa.x,pa.y)<D(mb[0],mb[1],pbb.x,pbb.y)?a:b}
function emergeFx(mx,my,dx,dy){const c=TH[zone()].neon;fxBurst(mx+dx*10,my+dy*10,c,8);rings.push(mkRing(mx,my,c,46));
for(let i=0;i<5;i++){const a=Math.atan2(dy,dx)+(Math.random()-.5)*1.6,s=30+Math.random()*60;fx.push({sm:1,x:mx,y:my,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7,L:.7,s:8+Math.random()*6})}
if(P&&D(mx,my,P.x,P.y)<600)sfxL(300,.12,'square',.04,900)}
function emerge(tb,k){const[mx,my]=mouth(tb),dr=dirOf(tb),e=mkEnemy(k,mx-dr[0]*4,my-dr[1]*4);e.em=.45;e.dx=dr[0];e.dy=dr[1];en.push(e);tb.f=.5;emergeFx(mx,my,dr[0],dr[1]);if(NET.mode=='host')EV.push(['m',mx,my,dr[0],dr[1]])}
function hurt(pl,d){if(pl.dead||pl.inv>0)return;if(pl.shield&&pl.shT<=0){pl.shT=pl.shield;pl.inv=.45;burst(pl.x,pl.y,'#7fe8ff',10);if(pl===P)sfxL(880,.15,'triangle',.15,440);return}
pl.hp-=d*1.35*pl.arm;pl.inv=.45;burst(pl.x,pl.y,'#ff6fae',10);if(pl===P){shake=Math.max(shake,7);sfxL(110,.18,'sawtooth',.25,35)}
if(pl.hp<=0){pl.hp=0;pl.dead=true;burst(pl.x,pl.y,'#fff',24);ring(pl.x,pl.y,'#ff6fae',80);if(PL.length>1&&pl===P)toast('K.O.! Du kommst in der nächsten Welle zurück','#ff7a8a');if(PL.every(p=>p.dead))gameEnd('dead')}}
function mkRing(x,y,c,m,dl){return{x,y,l:.35,L:.35,c,m,dl:dl||0}}
function ring(x,y,c,m,dl){rings.push(mkRing(x,y,c,m,dl));if(NET.mode=='host'&&EV.length<300)EV.push(['r',r1(x),r1(y),c,m,dl||0])}

if(n>=8)rings.push(mkRing(x,y,c,n>=40?90:28))}

function shootB(x,y,a,s,d,r,c,o){const b={x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,d,r:r||6,c:c||'r'};if(o)Object.assign(b,o);eb.push(b);return b}
function beamAng(h){const s=Math.min(1,Math.max(0,(h.t-h.warn)/h.dur));return h.dir>0?.15+(Math.PI-.3)*s:Math.PI-.15-(Math.PI-.3)*s}
function hazAngles(h){const el=Math.max(0,h.t-h.warn);if(h.k=='spin'){const r=[];for(let i=0;i<h.n;i++)r.push(h.a0+i*6.2832/h.n+el*h.sp);return r}return[h.a0+(h.a1-h.a0)*Math.min(1,el/h.dur)]}
function segHit(p,x,y,a,L,w){const px=p.x-x,py=p.y-y,al=px*Math.cos(a)+py*Math.sin(a);if(al<0||al>L)return false;return Math.abs(px*Math.sin(a)-py*Math.cos(a))<w/2+p.r*.5}
const bossOK=()=>boss&&!(boss.intro>0)&&!(boss.dying>0)&&boss.al>.5&&!(boss.z>40);
const vis=(x,y,m)=>x>camX-m&&x<camX+W+m&&y>camY-m&&y<camY+H+m;
const clX=x=>clamp(x,WALL+30,AW-WALL-30),clY=y=>clamp(y,WALL+30,AH-WALL-30);
function inInk(p){return hz.some(h=>h.k=='ink'&&h.t>h.warn&&D(p.x,p.y,h.x,h.y)<h.r)}
function camTo(dt,x,y){const cx=clamp(x-W/2,0,AW-W),cy=clamp(y-H/2,0,AH-H),k=Math.min(1,dt*6);camX+=(cx-camX)*k;camY+=(cy-camY)*k}
function playerMove(dt){if(!P)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
if(mouse){const mx=mouse.x+camX,my=mouse.y+camY;if(D(mx,my,P.x,P.y)>10){dx=mx-P.x;dy=my-P.y}}
const m=Math.hypot(dx,dy),sp=P.spd*(inInk(P)?.55:1);if(m){P.x+=dx/m*sp*dt;P.y+=dy/m*sp*dt}
P.mv=m?dx/m:0;P.tl+=(P.mv*.16-P.tl)*Math.min(1,dt*10);
P.x=clamp(P.x,WALL+P.r,AW-WALL-P.r);P.y=clamp(P.y,WALL+P.r,AH-WALL-P.r)}
function fxUpdate(dt){for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96;if(f.vr)f.r+=f.vr*dt;f.l-=dt}fx=fx.filter(f=>f.l>0);
for(const r of rings){if(r.dl>0)r.dl-=dt;else r.l-=dt}rings=rings.filter(r=>r.l>0);
for(const bo of bolts)bo.l-=dt;bolts=bolts.filter(b=>b.l>0);
for(const q of toasts)q.t-=dt;toasts=toasts.filter(q=>q.t>0)}

function update(dt){
t+=dt;msgT-=dt;flashA=Math.max(0,flashA-dt*2);shake=Math.max(0,shake-dt*30);prof.stats.time+=dt;
for(const tb of TUBES){tb.f=Math.max(0,tb.f-dt);tb.ch=0}
fxUpdate(dt);
if(boss&&boss.intro>0){bossIntro(dt);camTo(dt,boss.x,boss.y);return}
if(boss&&boss.dying>0){const b=boss;bossDying(dt);camTo(dt,b.x,b.y);return}
for(const pl of PL){pl.inv-=dt;pl.shT-=dt;pl.sr=pl.shield&&pl.shT<=0?1:0;if(!pl.dead&&pl.reg)heal(pl,pl.reg*dt)}
playerMove(dt);camTo(dt,P.x,P.y);
if(post>0){post-=dt;if(post<=0){if(winPending)gameEnd('win');else endWave()}return}
const slow=Math.max(0,...PL.filter(p=>!p.dead).map(p=>p.slow)),edt=dt*(1-slow);
for(const pl of PL){if(pl.dead)continue;pl.cd-=dt;
if(pl.cd<=0){const tg=nearest(pl.x,pl.y,620);if(tg){const a=Math.atan2(tg.y-pl.y,tg.x-pl.x);for(let i=0;i<pl.multi;i++){const b=a+(i-(pl.multi-1)/2)*pl.spread;pb.push({x:pl.x,y:pl.y,vx:Math.cos(b)*pl.sp,vy:Math.sin(b)*pl.sp,pr:pl.pierce,hit:[],l:pl.boomer?1.6:1.1,bn:pl.bounce,o:pl,bg:pl.big})}pl.cd=1/pl.rate}}
if(pl.aura){for(const e of en)if(D(e.x,e.y,pl.x,pl.y)<75)e.hp-=pl.aura*dt;if(bossOK()&&D(boss.x,boss.y,pl.x,pl.y)<75+boss.r)boss.hp-=pl.aura*dt}
petsUpdate(pl,dt)}
for(const mn of mineL){mn.arm-=dt;if(mn.arm>0)continue;const tg=nearest(mn.x,mn.y,60);if(tg&&D(tg.x,tg.y,mn.x,mn.y)<tg.r+16){mn.gone=1;explode(mn.x,mn.y,62,mn.o.dmg*3,'#ffcf5a')}}mineL=mineL.filter(m=>!m.gone);
for(const bb of bombL){bb.t+=dt;if(bb.t>=.55){bb.gone=1;explode(bb.tx,bb.ty,75,bb.o.dmg*4,'#8fe36b')}}bombL=bombL.filter(b=>!b.gone);
const nb=[],tgs=en.concat(bossOK()?[boss]:[]);
for(const b of pb){const o=b.o;
if(o.homing&&!b.ret&&!b.sh){const tg=nearest(b.x,b.y,320);if(tg){const sp=Math.hypot(b.vx,b.vy),ca=Math.atan2(b.vy,b.vx);let da=Math.atan2(tg.y-b.y,tg.x-b.x)-ca;da=Math.atan2(Math.sin(da),Math.cos(da));const na=ca+Math.sign(da)*Math.min(Math.abs(da),3.5*o.homing*dt);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp}}
if(o.boomer&&!b.pet&&!b.sh&&!b.ret&&b.l<.8){b.ret=1;b.hit=[]}
if(b.ret){const sp=Math.hypot(b.vx,b.vy),a=Math.atan2(o.y-b.y,o.x-b.x);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;if(D(b.x,b.y,o.x,o.y)<14)b.l=0}
b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
if(b.bn>0&&!b.ret){let w=0;if(b.x<WALL||b.x>AW-WALL){b.vx*=-1;b.x=clamp(b.x,WALL,AW-WALL);w=1}if(b.y<WALL||b.y>AH-WALL){b.vy*=-1;b.y=clamp(b.y,WALL,AH-WALL);w=1}if(w){b.bn--;b.l=Math.max(b.l,.6);b.hit=[];burst(b.x,b.y,'#fff3c4',3)}}
const hr=5+o.big*2.5;for(const e of tgs){if(b.l<=0||b.hit.includes(e)||e.em>0||e.al<.4||e.z>20)continue;if(D(b.x,b.y,e.x,e.y)<e.r+hr*(b.sh?.6:1)){hitE(e,b,nb);if(b.pr--<=0)b.l=0}}}
pb=pb.concat(nb).filter(b=>b.l>0);
spawnT-=dt;if(queue.length&&spawnT<=0){pend.push({tb:pickTube(),k:queue.pop(),t:0});spawnT=Math.max(.08,(.55-wave*.005)/(1+(PL.length-1)*.4))}
for(const p of pend){p.t+=dt;p.tb.ch=Math.max(p.tb.ch,Math.min(1,p.t/.7));if(p.t>=.7){p.done=1;emerge(p.tb,p.k)}}pend=pend.filter(p=>!p.done);
enemyAI(dt,edt);
const born=[],boom=Math.max(0,...PL.map(p=>p.boom));
for(const e of en)if(e.hp<=0&&!e.dead){e.dead=1;killCount++;prof.stats.kills++;burst(e.x,e.y,EC[e.k]||'#ff3b5c',10);
if(e.k==8)for(let i=0;i<8;i++)shootB(e.x,e.y,i*.785,200,10+wave*.2,6,'c');
if(e.k==9&&!e.small)for(const s of[-1,1]){const c=mkEnemy(9,e.x+s*12,e.y,{small:1,r:10});c.hp=c.mhp=e.mhp*.4;c.em=.25;c.dx=s;c.dy=0;born.push(c)}
if(boom){ring(e.x,e.y,'#c77dff',60);for(const o of en)if(!o.dead&&D(o.x,o.y,e.x,e.y)<65){o.hp-=boom;o.fl=.08}if(bossOK()&&D(boss.x,boss.y,e.x,e.y)<65+boss.r)boss.hp-=boom}}
en=en.filter(e=>e.hp>0).concat(born);
if(prof.stats.kills%250==0)checkAch();
const nbe=[];
for(const b of eb){if(b.dl>0){b.dl-=edt;continue}
if(b.hm){const T=nearPl(b.x,b.y),ta=Math.atan2(T.y-b.y,T.x-b.x),ca=Math.atan2(b.vy,b.vx),da=Math.atan2(Math.sin(ta-ca),Math.cos(ta-ca)),na=ca+Math.sign(da)*Math.min(Math.abs(da),b.hm*edt),sp=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp}
if(b.sw)b.vx+=Math.cos(t*3+b.ph)*b.sw*edt;
b.x+=b.vx*edt;b.y+=b.vy*edt;
if(b.l!==undefined){b.l-=edt;if(b.l<=0)b.dead=1}
if(b.spl!==undefined){b.spl-=edt;if(b.spl<=0){b.dead=1;burst(b.x,b.y,'#9cff6a',6);for(let i=0;i<6;i++)nbe.push({x:b.x,y:b.y,vx:Math.cos(i*1.047)*190,vy:Math.sin(i*1.047)*190,d:b.d*.7,r:6,c:'g'})}}
if(!b.dead)for(const pl of PL){if(pl.dead)continue;if(D(b.x,b.y,pl.x,pl.y)<b.r+pl.r-4){hurt(pl,b.d);b.dead=1;break}}}

const cnt=cnt0[it.n]||0,lines=[];if(it.mx<99)lines.push('Stufe '+(cnt+1)+' von '+it.mx);if(it.pj)lines.push('Extra-Projektile: '+(xp+it.pj)+' / '+MAXPJ);if(it.ex)lines.push('Sperrt: '+exOther(it));
lines.forEach((s,j)=>txt(s,r.x+110,y0+r.h-14-(lines.length-1-j)*15,11,j==lines.length-1&&it.ex?'#ff9aa8':'#8a83b8','center',FB,800));BTN.push({x:r.x,y:r.y,w:r.w,h:r.h,fn:()=>pick(i)})})}

/* ---------- Formulare (Anmelden, Code, Name) ---------- */
const MD=document.getElementById('modal'),MF=document.getElementById('mf');let mOk=null;
function openModal(ttl,fields,ok,note,fn){document.getElementById('mt').textContent=ttl;const box=document.getElementById('mfields');box.textContent='';
for(const f of fields){const l=document.createElement('label');l.textContent=f.label;const i=document.createElement('input');i.id='f_'+f.id;i.name=f.id;i.type=f.type||'text';i.maxLength=f.max||32;i.value=f.value||'';if(f.cls)i.className=f.cls;if(f.ac)i.autocomplete=f.ac;i.required=true;l.appendChild(i);box.appendChild(l)}
document.getElementById('mnote').textContent=note||'';document.getElementById('merr').textContent='';document.getElementById('mok').textContent=ok;mOk=fn;MD.hidden=false;keys={};mouse=null;setTimeout(()=>{const i=box.querySelector('input');if(i)i.focus()},30)}
function closeModal(){MD.hidden=true;mOk=null}
MF.addEventListener('submit',async e=>{e.preventDefault();if(!mOk)return;const v={};for(const i of MF.querySelectorAll('input'))v[i.name]=i.value;const b=document.getElementById('mok');b.disabled=true;
try{await mOk(v);closeModal()}catch(x){document.getElementById('merr').textContent=x.message||'Das hat nicht geklappt'}b.disabled=false});
document.getElementById('mcancel').onclick=closeModal;
MD.addEventListener('pointerdown',e=>{if(e.target===MD)closeModal()});
const openLogin=()=>openModal('Anmelden',[{id:'user',label:'Spielername',ac:'username',max:16},{id:'pass',label:'Passwort',type:'password',ac:'current-password',max:100}],'Anmelden','',v=>doAuth(v.user.trim(),v.pass,false));
const openRegister=()=>openModal('Konto erstellen',[{id:'user',label:'Spielername',ac:'username',max:16},{id:'pass',label:'Passwort',type:'password',ac:'new-password',max:100},{id:'pass2',label:'Passwort wiederholen',type:'password',ac:'new-password',max:100}],'Registrieren','Name: 3–16 Zeichen (Buchstaben, Zahlen, _). Passwort: mindestens 6 Zeichen. Dein bisheriger Fortschritt wird übernommen.',
v=>{if(v.pass!==v.pass2)throw new Error('Die Passwörter sind nicht gleich');if(v.pass.length<6)throw new Error('Das Passwort braucht mindestens 6 Zeichen');return doAuth(v.user.trim(),v.pass,true)});
const openName=()=>openModal('Spielername',[{id:'name',label:'Name',value:prof.name,max:16}],'Speichern','So sehen dich andere im Mehrspieler.',v=>{const n=v.name.trim().slice(0,16);if(!n)throw new Error('Bitte gib einen Namen ein');prof.name=n;saveProf()});
const openJoin=()=>openModal('Party beitreten',[{id:'code',label:'Party-Code',cls:'code',max:4}],'Beitreten','Den Code zeigt dir der Host in seiner Party.',v=>{const c=v.code.trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c))throw new Error('Der Code hat genau 4 Zeichen');joinParty(c)});

/* ---------- Eingabe ---------- */
function click(x,y){clickPt={x,y};for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(!b.off&&inR({x,y},b)){sfxL(520,.05,'square',.04,700);b.fn();return}}
if(scene=='dead'||scene=='win')backFromEnd()}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{snd();const p=pos(e);if(scene=='play')mouse=p;else click(p.x,p.y)});
cv.addEventListener('pointermove',e=>{hov=pos(e);if(mouse&&scene=='play')mouse=hov;if(SL&&e.buttons)slideTo(hov.x)});
cv.addEventListener('pointerleave',()=>hov=null);
addEventListener('pointerup',()=>{mouse=null;SL=null});
addEventListener('keydown',e=>{if(!MD.hidden){if(e.key=='Escape')closeModal();return}const k=e.key.toLowerCase();keys[k]=1;snd();
if(k=='m'){set.music=set.music>0?0:.7;saveSet()}if(k.startsWith('arrow')||k==' ')e.preventDefault();
if(k=='escape'){goBack();return}
if(scene=='select'){const d=k=='e'||k=='arrowright'?1:k=='q'||k=='arrowleft'?-1:0;if(d){let n=sel;for(let j=0;j<V.length;j++){n=(n+d+V.length)%V.length;if(isOpen(n)){sel=n;break}}}if(k=='enter'||k==' ')startSingle()}
else if(scene=='main'&&k=='enter')scene='playmenu';
else if(scene=='pick'&&['1','2','3'].includes(k))pick(+k-1);
else if((scene=='dead'||scene=='win')&&k=='enter')backFromEnd()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('blur',()=>{keys={};mouse=null});
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
if(NET.mode=='guest'&&P&&['play','pick','dead','win'].includes(scene))guestUpdate(dt);
else if(scene=='play')update(dt);else{t+=dt;fxUpdate(dt)}
if(NET.mode=='host'&&NET.ws){netT+=dt;if(netT>=1/15){netT=0;send(snap())}}
draw();music();requestAnimationFrame(loop)})(last);
checkServer();
</script>
